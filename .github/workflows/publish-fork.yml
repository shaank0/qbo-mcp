name: publish-fork

on:
  push:
    branches: [gateway]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The test gate. This workflow is the ONLY one that triggers on `gateway`
      # (every other workflow is main-only), and the gateway catalog pins
      # :latest — so without these steps any push that merely COMPILES
      # republishes the image users get, with the suite never having run.
      #
      # The tools/list smoke test below catches a missed registration but not a
      # behavioural regression: flattening a pre-existing report tool's output,
      # or breaking the section context that carries account attribution, both
      # sail through it. Those are unit-tested, so the units must run first.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # provenance/sbom off deliberately: build-push-action@v6 defaults them on,
      # which makes buildx emit an image index with an attestation manifest.
      # With `load: true`, a later push then fails with `unknown blob`.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/qbo-mcp:ci

      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          docker run -d --name qbo -p 8080:8080 \
            -e AUTH_MODE=gateway -e MCP_TRANSPORT=http \
            ghcr.io/${{ github.repository_owner }}/qbo-mcp:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/health && break
            sleep 1
          done

          # In AUTH_MODE=gateway, the server requires X-Qbo-Access-Token and
          # X-Qbo-Realm-Id on EVERY /mcp request (src/index.ts) -- including
          # initialize and tools/list, which never touch the QBO API. Values
          # below are placeholders, not real credentials.
          #
          # This server is also intentionally stateless (StreamableHTTPServerTransport
          # is built with sessionIdGenerator: undefined -- see src/index.ts): it
          # never issues an Mcp-Session-Id, so none is captured or replayed here.
          creds=(-H 'X-Qbo-Access-Token: ci-smoke-test-token' -H 'X-Qbo-Realm-Id: 0000000000')

          curl -sf -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${creds[@]}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            > /dev/null

          curl -sf -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${creds[@]}" \
            -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' > /dev/null

          names=$(curl -sf -X POST http://localhost:8080/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            "${creds[@]}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | python3 -c 'import sys,json; print(" ".join(t["name"] for t in json.load(sys.stdin)["result"]["tools"]))')

          # Every tool this fork exists to add must actually be served. A handler
          # can be correct while registration is missed, and tools/list is the
          # only thing that proves otherwise.
          for t in qbo_reports_transaction_list qbo_reports_profit_and_loss_detail \
                   qbo_reports_aged_receivable_detail qbo_reports_class_sales \
                   qbo_reports_journal_report qbo_projects_list; do
            echo "$names" | grep -qw "$t" || { echo "MISSING TOOL: $t"; exit 1; }
          done
          echo "all fork tools served"
          docker rm -f qbo

      - name: Push the tested artifact
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/qbo-mcp:ci \
                     ghcr.io/${{ github.repository_owner }}/qbo-mcp:latest
          docker tag ghcr.io/${{ github.repository_owner }}/qbo-mcp:ci \
                     ghcr.io/${{ github.repository_owner }}/qbo-mcp:sha-${{ steps.sha.outputs.short }}
          docker push ghcr.io/${{ github.repository_owner }}/qbo-mcp:latest
          docker push ghcr.io/${{ github.repository_owner }}/qbo-mcp:sha-${{ steps.sha.outputs.short }}
